[project]
name = "tracesmart"
version = "0.1.0"
description = "Image tracing that understands the picture: Segment Anything (SAM 2.1 / SAM 3) segmentation, one clean flat-colour SVG path per object"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Barton Muller" }]
keywords = ["image-to-svg", "vectorization", "svg", "image-tracing", "semantic-segmentation", "segment-anything", "sam2", "sam3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "resvg-py>=0.5.0",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/barton-muller/tracesmart"
Issues = "https://github.com/barton-muller/tracesmart/issues"

[project.scripts]
tracesmart = "tracesmart.cli:main"

[project.optional-dependencies]
faces = [
    "face-alignment>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "scikit-image>=0.26.0",
    "vtracer>=0.6.15",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tracesmart/cli.py" = ["B008"]  # typer declares options as argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
